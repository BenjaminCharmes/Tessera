<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Journal d'un service</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#18181b}
a{color:#c4b5fd}a:hover{color:#ddd6fe}
.btn{font:500 12px Inter,system-ui,sans-serif;color:#e4e4e7;background:#27272a;border:1px solid #3f3f46;border-radius:6px;padding:6px 10px;min-height:30px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#3f3f46}
.btn.on{background:#3f3f46;color:#fafafa}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #e4e4e7; background: #18181b; min-height: 900px; display: flex; flex-wrap: wrap">

  <!-- La salle, assombrie derrière le panneau -->
  <div aria-hidden="true" style="flex: 1 1 420px; min-width: 0; background: #131316; padding: 24px; box-sizing: border-box; opacity: .55">
    <div style="height: 360px; border: 1px solid #7f1d1d; border-radius: 10px; background: linear-gradient(#2a2a31 0 72%, #1c1c21 72% 100%)"></div>
  </div>

  <!-- Panneau du journal -->
  <aside aria-label="Journal du service worker" style="flex: 999 1 760px; max-width: 980px; min-width: 0; background: #0f0f12; border-left: 1px solid #3f3f46; display: flex; flex-direction: column">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 14px 18px; border-bottom: 1px solid #27272a">
      <span style="width: 10px; height: 10px; background: #ef4444; display: block; border-radius: 2px"></span>
      <h2 style="margin: 0; font-size: 14px; font-weight: 600">Kadoomi · worker</h2>
      <span style="font-size: 12px; color: #f87171">tombé à 09:27 · code de sortie 1</span>
      <div style="margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap">
        <button class="btn" style="background: #6d28d9; border-color: #7c3aed">Relancer</button>
        <button class="btn">Copier</button>
        <button class="btn" aria-label="Fermer le journal">✕</button>
      </div>
    </div>

    <!-- Filtres -->
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 18px; border-bottom: 1px solid #27272a">
      <div role="group" aria-label="Filtrer par niveau" style="display: flex; gap: 6px">
        <button class="btn on">Tout · 200</button>
        <button class="btn">Erreurs · 2</button>
        <button class="btn">Avert. · 1</button>
      </div>
      <label for="q" style="position: absolute; left: -9999px">Chercher dans le journal</label>
      <input id="q" placeholder="Chercher…" style="flex: 1 1 200px; min-width: 0; background: #18181b; border: 1px solid #3f3f46; border-radius: 6px; color: #e4e4e7; padding: 6px 10px; font: 12px Inter, sans-serif; min-height: 30px; box-sizing: border-box">
      <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #a1a1aa"><input type="checkbox" checked> Suivre la fin</label>
    </div>

    <!-- Lignes -->
    <div style="flex: 1; overflow: auto; padding: 10px 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.7">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="16">
        <div style="display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 0 18px; background: {{l.bg}}">
          <span style="color: #71717a; text-align: right">{{l.n}}</span>
          <span style="color: {{l.c}}; white-space: pre-wrap; word-break: break-word">{{l.t}}</span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 10px 18px; border-top: 1px solid #27272a; font-size: 11px; color: #a1a1aa">
      <span>200 dernières lignes conservées par Tessera (stdout + stderr)</span>
      <span>commande : npm run worker · dossier : kadoomi/</span>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const N = '#d4d4d8', E = '#fca5a5', W = '#fcd34d', Z = '#a1a1aa';
    const raw = [
      ['> kadoomi-worker@1.4.0 worker', Z], ['> node dist/worker.js', Z],
      ['[08:51:02] worker démarré · 3 files', N], ['[08:51:02] queue reminders · 12 jobs', N],
      ['[09:12:40] job reminders#806 done in 410ms', N], ['[09:18:05] job reminders#807 done in 388ms', N],
      ['[09:22:31] WARN retry imports#77 (1/3)', W], ['[09:26:58] job reminders#812 started', N],
      ['[09:27:01] Error: connect ECONNREFUSED 127.0.0.1:5432', E],
      ['    at TCPConnectWrap.afterConnect [as oncomplete] (node:net:1611:16)', E],
      ['    at Pool.connect (dist/db/pool.js:44:11)', E],
      ['[09:27:01] fatal: database unreachable, exiting', E], ['process exited with code 1', E]
    ];
    return {
      lines: raw.map((r, i) => ({ n: 188 + i, t: r[0], c: r[1], bg: r[1] === E ? 'rgba(127,29,29,.22)' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
