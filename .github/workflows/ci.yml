name: CI

# `pull_request` seul. Chaque PR déclenchait autrefois **deux** runs — celui du
# `push` sur la branche et celui de la `pull_request` — et tout était facturé en
# double (ticket-095). Il restait un doublon : `push: [main]` rejouait, après le
# merge, la release que sa propre PR venait de vérifier. Le commentaire d'alors
# le justifiait en disant que `main` ne reçoit pas de PR, ce qui est faux —
# elle reçoit celles de `develop` (ticket-111).
#
# Rien n'entre dans `main` autrement que par une PR : les commits directs y sont
# interdits, et `pull_request` couvre donc tout.
on:
  pull_request:
    # `develop` est la cible par défaut des PR de ticket (ADR — ticket-049) :
    # sans elle ici, une PR vers develop ne déclenche aucun check.
    branches: [main, develop]
    # `edited` : un titre ou un corps de PR modifié peut introduire un terme
    # interdit, et c'est aussi ce que la publication expose (ticket-230).
    types: [opened, synchronize, reopened, edited]

# Une nouvelle poussée rend la précédente inutile : l'annuler évite de payer
# un run dont personne ne lira le résultat.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `runs-on` se choisit par la variable de depot `CI_RUNNER`. Les minutes
# Actions incluses pour un depot prive sont epuisees depuis que ce depot est
# repasse en prive (ticket-160) : plus aucune PR ne declenchait de run. Un
# runner self-hosted n'en consomme aucune. La variable vide rend la CI aux
# runners GitHub sans toucher a ce fichier, donc sans PR (ticket-161).
permissions:
  contents: read
  pull-requests: write

jobs:

  termes-interdits:
    # ADR-050 côté GitHub : ce que la PR publierait — lignes ajoutées,
    # messages, auteurs et committers, titre et corps — contre la liste gardée
    # en secret. Toujours sur un runner GitHub : c'est lui qui porte le secret.
    # Requis par la protection de `develop` et de `main` (ticket-230).
    # Le nom affiché garde « ADR-048 » : c'est l'identifiant du check requis
    # par la protection de branche — le renommer se fait avec elle, à la main.
    name: Termes interdits (ADR-048)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Contrôler la PR
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/termes_interdits_ci.py

  backend:
    name: Backend (pytest)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: cd backend && uv sync --locked --extra dev

      - name: Run tests with coverage
        run: cd backend && uv run pytest -v -m "not integration" --cov=tessera --cov-report=term-missing --cov-report=xml
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-test-ci-key' }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

      - name: Coverage report on PR (backend)
        # Sur une PR venue d'un fork, GITHUB_TOKEN est en lecture seule : le
        # commentaire échouerait et ferait passer la CI au rouge pour rien.
        # Linux seulement : ces actions ne sont pas garanties ailleurs, et un
        # commentaire de couverture ne vaut pas un run rouge (ticket-161).
        if: runner.os == 'Linux' && github.event.pull_request.head.repo.full_name == github.repository
        uses: orgoro/coverage@v3.3
        with:
          coverageFile: backend/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: cd backend && uv run mypy src/

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npm run typecheck

      - name: Lint
        run: cd frontend && npm run lint

      - name: Unit tests with coverage
        run: cd frontend && npm run test:coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Coverage report on PR (frontend)
        if: runner.os == 'Linux' && github.event.pull_request.head.repo.full_name == github.repository
        uses: romeovs/lcov-reporter-action@v0.4.0
        with:
          lcov-file: frontend/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: "Coverage Frontend"
          filter-changed-files: false

  e2e:
    name: E2E (Playwright)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # `--with-deps` installe des paquets systeme par `apt` : il n'existe
      # que sur Linux, et le passer ailleurs fait echouer l'etape.
      - name: Install Playwright browsers (Linux)
        if: runner.os == 'Linux'
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Install Playwright browsers
        if: runner.os != 'Linux'
        run: cd frontend && npx playwright install chromium

      - name: Run E2E tests
        run: cd frontend && npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/

  # La coquille Tauri bouge une fois tous les trente tickets, et une minute
  # de macOS est facturée **dix fois** une minute d'ubuntu : ce job coûtait à
  # lui seul les trois quarts de la CI, pour dix-huit secondes de `cargo
  # check`. Il ne tourne donc plus que quand le Rust change (ticket-095).
  detecter:
    name: Ce qui a changé
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      tauri: ${{ steps.filtre.outputs.tauri }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filtre
        name: Le Rust a-t-il bougé ?
        # Ce script est du POSIX ; un runner Windows ouvrirait `pwsh`, où il
        # n'est même pas analysable.
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "tauri=true" >> "$GITHUB_OUTPUT"   # dans le doute, on vérifie
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -q "^frontend/src-tauri/"; then
            echo "tauri=true" >> "$GITHUB_OUTPUT"
          else
            echo "tauri=false" >> "$GITHUB_OUTPUT"
          fi

  tauri:
    name: Tauri (cargo check)
    needs: detecter
    if: needs.detecter.outputs.tauri == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "frontend/src-tauri -> target"

      - name: Cargo check
        run: cd frontend/src-tauri && cargo check
