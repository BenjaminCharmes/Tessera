name: CI

# `pull_request` seul. Chaque PR déclenchait autrefois **deux** runs — celui du
# `push` sur la branche et celui de la `pull_request` — et tout était facturé en
# double (ticket-095). Il restait un doublon : `push: [main]` rejouait, après le
# merge, la release que sa propre PR venait de vérifier. Le commentaire d'alors
# le justifiait en disant que `main` ne reçoit pas de PR, ce qui est faux —
# elle reçoit celles de `develop` (ticket-111).
#
# Rien n'entre dans `main` autrement que par une PR : les commits directs y sont
# interdits, et `pull_request` couvre donc tout.
on:
  pull_request:
    # `develop` est la cible par défaut des PR de ticket (ADR — ticket-049) :
    # sans elle ici, une PR vers develop ne déclenche aucun check.
    branches: [main, develop]

# Une nouvelle poussée rend la précédente inutile : l'annuler évite de payer
# un run dont personne ne lira le résultat.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: cd backend && uv sync --extra dev

      - name: Run tests with coverage
        run: cd backend && uv run pytest -v -m "not integration" --cov=tessera --cov-report=term-missing --cov-report=xml
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-test-ci-key' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

      - name: Coverage report on PR (backend)
        if: github.event_name == 'pull_request'
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: backend/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: cd backend && uv run mypy src/

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npm run typecheck

      - name: Unit tests with coverage
        run: cd frontend && npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Coverage report on PR (frontend)
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.4.0
        with:
          lcov-file: frontend/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: "Coverage Frontend"
          filter-changed-files: false

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd frontend && npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/

  # La coquille Tauri bouge une fois tous les trente tickets, et une minute
  # de macOS est facturée **dix fois** une minute d'ubuntu : ce job coûtait à
  # lui seul les trois quarts de la CI, pour dix-huit secondes de `cargo
  # check`. Il ne tourne donc plus que quand le Rust change (ticket-095).
  detecter:
    name: Ce qui a changé
    runs-on: ubuntu-latest
    outputs:
      tauri: ${{ steps.filtre.outputs.tauri }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filtre
        name: Le Rust a-t-il bougé ?
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "tauri=true" >> "$GITHUB_OUTPUT"   # dans le doute, on vérifie
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -q "^frontend/src-tauri/"; then
            echo "tauri=true" >> "$GITHUB_OUTPUT"
          else
            echo "tauri=false" >> "$GITHUB_OUTPUT"
          fi

  tauri:
    name: Tauri (cargo check)
    needs: detecter
    if: needs.detecter.outputs.tauri == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "frontend/src-tauri -> target"

      - name: Cargo check
        run: cd frontend/src-tauri && cargo check
