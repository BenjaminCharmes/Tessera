# Les mises à jour de sécurité arrivent en PR plutôt que par une veille
# manuelle, qui ne se fait jamais. Cadence mensuelle et PR groupées : sur un
# projet à un seul mainteneur, un flux quotidien finit ignoré, et une règle
# qu'on ignore ne protège de rien.
version: 2
updates:
  # Toutes les PR ciblent `develop`, comme celles de ticket : rien n'entre dans
  # `main` autrement que par une PR de release. Sans cette clef, Dependabot vise
  # la branche par défaut du dépôt — donc `main` — et ses PR arrivent à
  # contre-courant du flux (ticket-114).
  - package-ecosystem: "pip"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/frontend/src-tauri"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      tauri:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
