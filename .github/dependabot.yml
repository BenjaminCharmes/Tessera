# Les mises à jour de sécurité arrivent en PR plutôt que par une veille
# manuelle, qui ne se fait jamais. Cadence mensuelle et PR groupées : sur un
# projet à un seul mainteneur, un flux quotidien finit ignoré, et une règle
# qu'on ignore ne protège de rien.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/frontend/src-tauri"
    schedule:
      interval: "monthly"
    groups:
      tauri:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
