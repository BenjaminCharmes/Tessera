[package]
name = "tessera"
version = "0.1.0"
description = "Tessera — AI-orchestrated multi-project IDE"
authors = ["Benjamin CHARMES <benjamin.charmes@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tessera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
# Les notifications systeme de l'app desktop (ticket-200). La seule
# permission ouverte est `notification:default` : ADR-040 tient.
tauri-plugin-notification = "2"
