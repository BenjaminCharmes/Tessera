<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Tessera">
  <title>Tessera</title>
  <style>
    /* ADR-026 : le violet porte l'identité, jamais un état. */
    .pose { fill: #ddd6f6; }
    .tenue { fill: #7c3aed; }
    @media (prefers-color-scheme: dark) {
      .pose { fill: #3a3348; }
      .tenue { fill: #a78bfa; }
    }
  </style>

  <!--
    Le jour autour de la tesselle en cours. Sans lui, la pièce déborde sur ses
    voisines et se lit comme un trou dans le pavement au lieu d'une pièce
    posée devant — vérifié au rendu, pas supposé. Un masque plutôt qu'un fond
    plein : le favicon doit rester transparent.
  -->
  <mask id="jour">
    <rect width="64" height="64" fill="#fff"/>
    <rect x="20" y="20" width="28" height="28" rx="5" fill="#000"/>
  </mask>

  <!-- Le pavement : huit tesselles posées, la neuvième place laissée libre. -->
  <g class="pose" mask="url(#jour)">
    <rect x="8" y="8" width="16" height="16" rx="2"/>
    <rect x="26" y="8" width="16" height="16" rx="2"/>
    <rect x="44" y="8" width="16" height="16" rx="2"/>
    <rect x="8" y="26" width="16" height="16" rx="2"/>
    <rect x="44" y="26" width="16" height="16" rx="2"/>
    <rect x="8" y="44" width="16" height="16" rx="2"/>
    <rect x="26" y="44" width="16" height="16" rx="2"/>
    <rect x="44" y="44" width="16" height="16" rx="2"/>
  </g>

  <!-- La tesselle en cours : sortie de la grille, devant les autres. -->
  <rect class="tenue" x="23" y="23" width="22" height="22" rx="3"/>
</svg>
