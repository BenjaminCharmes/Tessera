[project]
name = "tessera"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "anthropic>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "aiosqlite>=0.20.0",
    "python-frontmatter>=1.1.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "claude-agent-sdk>=0.2.152",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
filterwarnings = [
    # Course connue entre le thread interne d'aiosqlite et le portail de
    # `TestClient` : le cycle de vie de l'application ouvre une connexion sur
    # la boucle du portail, dont le thread n'est pas toujours joint avant la
    # fermeture de cette boucle. Se produit uniquement sous Windows, sur les
    # tests WebSocket, et ne concerne que le harnais de test — aucun chemin
    # de production n'est en cause. Filtré pour que le reste de la sortie
    # reste significatif (ticket-053).
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]
markers = [
    "integration: tests nécessitant une session Claude Code authentifiée et qui facturent l'abonnement Claude (dés-activés en CI) — pas une ANTHROPIC_API_KEY",
]

[tool.coverage.run]
source = ["tessera"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.mypy]
strict = true
python_version = "3.11"


